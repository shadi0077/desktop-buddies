name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck and test
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # No argument builds every product in products/.
      - name: Build
        run: ./build.sh

      # Everything except the two suites that render real audio — a runner with
      # no audio device is a poorer test of those than a laptop is.
      - name: Test
        run: SKIP_AUDIO=1 ./test.sh

      - name: Both apps target macOS 11 (first Apple Silicon release)
        run: |
          for app in build/*.app; do
            name=$(basename "$app" .app)
            echo -n "$name: "
            otool -l "$app/Contents/MacOS/$name" \
              | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print "minos", $2; exit}'
          done
